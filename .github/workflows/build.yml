name: Build Luminol

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Paperclip JAR
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5.6.0
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build Luminol
        run: |
          chmod +x gradlew scripts/*.sh
          ./scripts/setup_and_build.sh

      - name: Generate checksums
        shell: bash
        run: |
          mapfile -t jars < <(
            find luminol-server/build/libs -maxdepth 1 -type f -name '*-paperclip-*.jar' | sort
          )
          if (( ${#jars[@]} == 0 )); then
            echo "::error::No Paperclip JAR was produced."
            exit 1
          fi
          sha256sum "${jars[@]}" > luminol-server/build/libs/SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Luminol-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            luminol-server/build/libs/*-paperclip-*.jar
            luminol-server/build/libs/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
